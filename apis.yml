name: Patientdesk.ai
description: >-
  Patientdesk.ai (Patientdesk AI, Inc.) is a California-based, Y Combinator-backed
  company building an AI-native operating system for dental practices. Its 24/7 AI
  phone receptionist handles inbound and outbound patient calls, appointment
  scheduling, real-time insurance verification during the call, automated payment
  collection and debt follow-up, intake, reminders, and lead generation. The product
  integrates directly with major dental practice management systems (Dentrix, Open
  Dental, Eaglesoft, Curve Dental, and others) to book patients straight into a
  clinic's calendar. Patientdesk.ai is HIPAA compliant, follows SOC 2 security
  standards, supports multiple languages, and is offered on month-to-month contracts.
  This profile was surfaced as a Y Combinator (Winter 2026) portfolio company and
  added to the API Evangelist network. No public developer/API surface (OpenAPI,
  docs, SDKs) is currently published; the company exposes a marketing site and a
  provider-authored llms.txt.
